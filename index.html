<style>
  :root {
    --bg: #ECEDF3;
    --header-start: #6178C4;
    --header-end: #2B3868;
    --card-bg: #FFFFFF;
    --ink: #15161B;
    --muted-c: #9195A8;
    --pill-blue-bg: #E7ECFB;
    --pill-blue-text: #3E52A3;
    --pill-gray-bg: #EEF0F4;
    --pill-gray-text: #9498AA;
    --dark-btn: #15161B;
    --accent: #33459C;
    --err-bg: #FDECEE;
    --err-text: #B4485A;
    --shadow: 0 10px 30px rgba(30,38,70,0.12);
    --shadow-soft: 0 2px 16px rgba(30,38,70,0.07);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%; background: var(--bg);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
  }
  .mono { font-family: inherit; }
  .page { max-width: 420px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; gap: 14px; }

  .header-card {
    position: relative; overflow: hidden; border-radius: 26px;
    background: linear-gradient(135deg, var(--header-start), var(--header-end));
    padding: 22px 22px 18px; color: #fff; box-shadow: var(--shadow);
  }
  .header-card::after {
    content: ""; position: absolute; top: -50px; right: -40px; width: 170px; height: 170px;
    border-radius: 50%; background: rgba(255,255,255,0.10);
  }
  .header-card::before {
    content: ""; position: absolute; bottom: -70px; left: -30px; width: 140px; height: 140px;
    border-radius: 50%; background: rgba(255,255,255,0.06);
  }
  .header-photo {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 55%; height: auto; object-fit: contain; opacity: 0.09; z-index: 0; pointer-events: none;
  }
  .wordmark-row { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; position: relative; z-index: 1; }
  .wordmark-main { font-size: 19px; font-weight: 900; letter-spacing: -0.01em; color: #fff; }
  .wordmark-by { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: rgba(255,255,255,0.65); }
  .date-line { font-size: 19px; font-weight: 800; margin-top: 4px; letter-spacing: -0.2px; position: relative; z-index: 1; }
  .stat-pills { display: flex; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
  .stat-pill { flex: 1; min-width: 0; background: rgba(255,255,255,0.14); border-radius: 16px; padding: 10px 12px; }
  .stat-pill .label {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.85);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat-pill .value {
    font-size: 15.5px; font-weight: 800; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .card { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: var(--shadow-soft); }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .section-title { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-blue { background: #3E63E0; }
  .dot-green { background: #2FAE66; }

  .pill-btn {
    border: none; border-radius: 9999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; font-family: inherit; background: var(--pill-blue-bg); color: var(--pill-blue-text);
    white-space: nowrap; flex-shrink: 0;
  }
  .pill-btn.small { padding: 5px 10px; font-size: 11px; }

  .tabs-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs-row::-webkit-scrollbar { display: none; }
  .tab-item {
    flex: 0 0 auto; display: inline-flex; align-items: center; border-radius: 9999px;
    background: var(--pill-gray-bg); overflow: hidden;
  }
  .tab-item.active { background: var(--accent); }
  .tab-label {
    border: none; background: none; padding: 9px 4px 9px 16px; font-size: 13.5px;
    font-weight: 700; color: var(--pill-gray-text); cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .tab-item.active .tab-label { color: #fff; }
  .tab-label.solo { padding: 9px 16px; }
  .tab-x {
    border: none; background: none; padding: 9px 14px 9px 4px; font-size: 14px;
    color: inherit; opacity: 0.6; cursor: pointer; font-family: inherit; line-height: 1;
  }
  .tab-x:active { opacity: 1; }
  .tab-add {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed #C7CBDA;
    background: none; color: var(--accent); font-size: 16px; cursor: pointer; line-height: 1;
  }

  .field-label { font-size: 12px; font-weight: 700; color: var(--muted-c); margin: 12px 0 6px; }
  .field-label-row { display: flex; align-items: baseline; gap: 6px; margin: 12px 0 6px; }
  .field-label-row .field-label { margin: 0; }
  .field-label-row .legend-note { margin: 0; }
  .field-pill {
    display: flex; align-items: center; gap: 8px; background: var(--pill-gray-bg);
    border-radius: 14px; height: 34px; padding: 0 12px;
  }
  .field-pill input {
    flex: 1; border: none; background: transparent; font-size: 13.5px; font-family: inherit;
    color: var(--ink); min-width: 0;
  }
  .field-pill input:focus { outline: none; }
  .field-pill input[readonly] { color: var(--muted-c); cursor: pointer; }
  .field-pill .icon { font-size: 13px; color: var(--muted-c); flex-shrink: 0; }
  .field-pill .unit { font-size: 13px; color: var(--muted-c); flex-shrink: 0; }

  .items { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    border: none; border-radius: 9999px; background: var(--pill-blue-bg); color: var(--pill-blue-text);
    font-family: inherit; font-weight: 700; font-size: 13px; padding: 8px 8px 8px 12px; cursor: pointer;
    white-space: nowrap; text-align: center; display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.guest { background: #FBE1E4; color: #B4485A; }
  .chip-x { opacity: 0.55; font-weight: 700; cursor: pointer; padding: 2px 5px; }
  .chip-x:active { opacity: 1; }
  .greeting-banner { background: var(--pill-gray-bg); border-radius: 14px; padding: 12px 14px; text-align: center; margin: 14px 0; }
  .empty-line1 { font-weight: 700; color: var(--ink); font-size: 13.5px; }
  .empty-line2 { margin-top: 5px; font-size: 11.5px; color: var(--muted-c); }

  .add-row { display: flex; gap: 8px; margin-top: 12px; position: relative; }
  .add-row input {
    flex: 1; border: none; border-radius: 14px; background: var(--pill-gray-bg);
    height: 34px; padding: 0 12px; font-size: 13.5px; font-family: inherit; color: var(--ink); min-width: 0;
  }
  .add-row input:focus { outline: 2px solid var(--pill-blue-text); outline-offset: 0; }
  .add-row button {
    border: none; border-radius: 14px; background: var(--dark-btn); color: #fff;
    font-weight: 700; font-size: 13.5px; padding: 0 16px; cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .add-row button:active { opacity: 0.85; }
  .legend-note { font-size: 11px; color: var(--muted-c); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .suggest-list {
    margin-top: 6px; background: #fff; border-radius: 14px; box-shadow: 0 8px 22px rgba(30,38,70,0.14);
    overflow: hidden; display: none; max-height: 200px; overflow-y: auto;
  }
  .suggest-item { padding: 11px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #F1F2F6; }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:active { background: var(--pill-gray-bg); }

  .text-link {
    background: none; border: none; font-family: inherit; font-size: 12px; font-weight: 700;
    color: var(--muted-c); cursor: pointer; padding: 2px 0;
  }
  .text-link:disabled { opacity: 0.35; cursor: default; }

  .stat-cards { display: flex; gap: 10px; }
  .stat-card { flex: 1; background: var(--pill-gray-bg); border-radius: 18px; padding: 16px 10px; text-align: center; }
  .stat-card .emoji { font-size: 19px; }
  .stat-card .big { font-size: 21px; font-weight: 900; margin-top: 6px; color: var(--ink); }
  .stat-card .big.accent { color: var(--accent); }
  .stat-card .small { font-size: 11px; color: var(--muted-c); margin-top: 2px; font-weight: 600; }

  .formula-line { font-size: 11.5px; color: var(--muted-c); margin-top: 10px; text-align: center; }

  .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .sync-status { font-size: 11px; color: var(--muted-c); }
  .refresh-btn { background: none; border: none; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--pill-blue-text); cursor: pointer; }

  .receipt-thumb { width: 100%; max-height: 170px; object-fit: cover; border-radius: 14px; margin-top: 10px; cursor: pointer; display: block; }
  .receipt-actions { display: flex; align-items: center; gap: 14px; margin-top: 10px; }

  .image-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10,10,18,0.86);
    align-items: center; justify-content: center; z-index: 1100; padding: 20px;
  }
  .image-modal-overlay img { max-width: 100%; max-height: 100%; border-radius: 14px; }

  .error-banner {
    background: var(--err-bg); color: var(--err-text); font-size: 12.5px; font-weight: 600;
    padding: 10px 12px; border-radius: 12px; margin-top: 12px; display: none;
  }
  .error-banner.show { display: block; }

  .hint {
    max-width: 420px; width: 100%; color: #9195A8; font-size: 12px;
    line-height: 1.6; padding: 4px 10px 0; text-align: center; margin: 0 auto;
  }
  .page-wrap { display: flex; flex-direction: column; align-items: center; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,22,35,0.5);
    align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .modal-box { background: #fff; width: min(340px, 100%); padding: 22px; border-radius: 22px; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
  .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .modal-message { font-size: 13px; color: var(--muted-c); line-height: 1.5; margin-bottom: 14px; }
  .modal-input {
    width: 100%; border: none; border-radius: 14px; background: var(--pill-gray-bg);
    padding: 11px 14px; font-size: 15px; font-family: inherit; color: var(--ink); margin-bottom: 6px;
  }
  .modal-input:focus { outline: 2px solid var(--pill-blue-text); }
  .modal-textarea {
    width: 100%; border: none; border-radius: 14px; background: var(--pill-gray-bg);
    padding: 11px 14px; font-size: 14px; font-family: inherit; color: var(--ink); margin-bottom: 6px; resize: vertical;
  }
  .modal-textarea:focus { outline: 2px solid var(--pill-blue-text); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .modal-btn { font-family: inherit; font-size: 14px; font-weight: 700; border: none; border-radius: 9999px; padding: 10px 18px; cursor: pointer; }
  .modal-btn-cancel { background: none; color: var(--muted-c); }
  .modal-btn-confirm { background: var(--dark-btn); color: #fff; }
  .modal-btn-confirm:active { opacity: 0.85; }
</style>
</head>

      <span class="section-title"><span class="dot dot-green"></span><span id="summaryTitleText">정산 요약</span></span>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="emoji">🙋</div>
        <div class="big mono" id="countDisplay">0명</div>
        <div class="small">참석 인원</div>
      </div>
      <div class="stat-card">
        <div class="emoji">💰</div>
        <div class="big accent mono" id="perPersonDisplay">0원</div>
        <div class="small">1인당 (예상)정산 금액</div>
      </div>
    </div>
    <div class="formula-line mono" id="formulaLine"></div>

    <div class="field-label-row">
      <span class="field-label">총 금액</span>
      <span class="legend-note" id="billNote" style="display:none;">(1~3학년 전체 인원 기준 단순 N빵)</span>
    </div>
    <div class="field-pill">
      <span class="icon" id="billLock">🔒</span>
      <input id="billInput" class="mono" inputmode="numeric" placeholder="관리자만 입력 가능" readonly />
      <span class="unit">원</span>
    </div>

    <div id="receiptRow"></div>
    <input type="file" id="receiptFileInput" accept="image/*" style="display:none;" />

    <div class="footer-row">
      <span class="sync-status" id="syncStatus">불러오는 중…</span>
      <button class="refresh-btn" id="refreshBtn">↻ 새로고침</button>
    </div>
  </div>

  <p class="hint">이 화면은 링크를 보는 모든 사람에게 실시간으로 공유됩니다.</p>
</div>
</div>

<div class="image-modal-overlay" id="imageModalOverlay">
  <img id="imageModalImg" alt="영수증 크게 보기" />
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <input class="modal-input" id="modalInput" style="display:none;" />
    <textarea class="modal-textarea" id="modalTextarea" style="display:none;" rows="6"></textarea>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="modalCancel"></button>
      <button class="modal-btn modal-btn-confirm" id="modalConfirm"></button>
    </div>
  </div>
</div>

<script>
(function () {
  const db = firebase.database();
  const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const WEEKDAY = ['일','월','화','수','목','금','토'];

  let settings = { adminPin: null, roster: [] };
  let rounds = [];
  let activeRoundId = null;
  let isAdmin = false;
  let modalResolve = null;
  let secondsLeft = 10;
  let lastSyncLabel = "";

  const dateLine = document.getElementById("dateLine");
  const heroCount = document.getElementById("heroCount");
  const heroRound = document.getElementById("heroRound");
  const heroPerPerson = document.getElementById("heroPerPerson");

  const tabsRow = document.getElementById("tabsRow");
  const venueInput = document.getElementById("venueInput");
  const billInput = document.getElementById("billInput");
  const billLock = document.getElementById("billLock");
  const billNote = document.getElementById("billNote");
  const summaryTitleText = document.getElementById("summaryTitleText");
  const receiptRow = document.getElementById("receiptRow");
  const receiptFileInput = document.getElementById("receiptFileInput");
  const imageModalOverlay = document.getElementById("imageModalOverlay");
  const imageModalImg = document.getElementById("imageModalImg");
  const nameInput = document.getElementById("nameInput");
  const addBtn = document.getElementById("addBtn");
  const suggestList = document.getElementById("suggestList");
  const itemsList = document.getElementById("itemsList");
  const countDisplay = document.getElementById("countDisplay");
  const perPersonDisplay = document.getElementById("perPersonDisplay");
  const formulaLine = document.getElementById("formulaLine");
  const syncStatus = document.getElementById("syncStatus");
  const refreshBtn = document.getElementById("refreshBtn");
  const rosterBtn = document.getElementById("rosterBtn");
  const errorBanner = document.getElementById("errorBanner");

  const modalOverlay = document.getElementById("modalOverlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalMessage = document.getElementById("modalMessage");
  const modalInput = document.getElementById("modalInput");
  const modalTextarea = document.getElementById("modalTextarea");
  const modalCancel = document.getElementById("modalCancel");
  const modalConfirm = document.getElementById("modalConfirm");

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function nextLabel() { return `${2 + rounds.length}차`; }
  function formatWon(n) { return (Math.round(n) || 0).toLocaleString("ko-KR"); }
  function showError(msg, autoHide) {
    errorBanner.textContent = msg;
    errorBanner.classList.add("show");
    if (autoHide) setTimeout(() => { errorBanner.classList.remove("show"); }, 2600);
  }
  function clearError() { errorBanner.classList.remove("show"); errorBanner.textContent = ""; }

  function chosungOf(str) {
    let out = "";
    for (const ch of str) {
      const code = ch.charCodeAt(0) - 0xAC00;
      if (code >= 0 && code <= 11171) out += CHOSUNG[Math.floor(code / 588)];
      else out += ch;
    }
    return out;
  }

  function openModal({ title = "", message = "", inputType = null, placeholder = "", initialValue = "", confirmText = "확인", cancelText = "취소" }) {
    return new Promise((resolve) => {
      modalResolve = resolve;
      modalTitle.textContent = title;
      modalTitle.style.display = title ? "block" : "none";
      modalMessage.textContent = message;
      modalMessage.style.display = message ? "block" : "none";
      modalInput.style.display = "none";
      modalTextarea.style.display = "none";
      if (inputType === "textarea") {
        modalTextarea.style.display = "block";
        modalTextarea.placeholder = placeholder;
        modalTextarea.value = initialValue;
      } else if (inputType) {
        modalInput.style.display = "block";
        modalInput.type = inputType === "password" ? "password" : (inputType === "tel" ? "tel" : "text");
        modalInput.placeholder = placeholder;
        modalInput.value = initialValue;
      }
      modalCancel.style.display = cancelText ? "inline-block" : "none";
      modalCancel.textContent = cancelText;
      modalConfirm.textContent = confirmText;
      modalOverlay.style.display = "flex";
      setTimeout(() => {
        if (inputType === "textarea") modalTextarea.focus();
        else if (inputType) modalInput.focus();
      }, 60);
    });
  }
  function closeModal(result) {
    modalOverlay.style.display = "none";
    if (modalResolve) { const r = modalResolve; modalResolve = null; r(result); }
  }
  modalConfirm.addEventListener("click", () => {
    if (modalTextarea.style.display !== "none") closeModal(modalTextarea.value);
    else if (modalInput.style.display !== "none") closeModal(modalInput.value);
    else closeModal(true);
  });
  modalCancel.addEventListener("click", () => closeModal(null));
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(null); });
  modalInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); modalConfirm.click(); } });

  function setDateLine() {
    const now = new Date();
    dateLine.textContent = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")} (${WEEKDAY[now.getDay()]})`;
  }

  function ensureDefaultRound() {
    if (rounds.length === 0) rounds.push({ id: genId(), label: "2차", venue: "", attendees: [], bill: 0 });
    if (!activeRoundId || !rounds.some(r => r.id === activeRoundId)) activeRoundId = rounds[0].id;
  }

  async function loadSettings() {
    try {
      const snap = await db.ref("settings").once("value");
      const val = snap.val();
      if (val) {
        settings = { adminPin: val.adminPin || null, roster: Array.isArray(val.roster) ? val.roster : [] };
      }
    } catch (e) {}
  }
  async function loadRounds() {
    try {
      const snap = await db.ref("rounds").once("value");
      const val = snap.val();
      if (Array.isArray(val) && val.length > 0) {
        rounds = val.map(r => ({
          id: r.id,
          label: r.label || "차수",
          venue: r.venue || "",
          attendees: Array.isArray(r.attendees) ? r.attendees : [],
          bill: typeof r.bill === "number" ? r.bill : 0,
          ...(r.receipt ? { receipt: r.receipt } : {})
        }));
      }
    } catch (e) {}
    ensureDefaultRound();
  }
  async function refreshRoundsPreserveActive() {
    const keep = activeRoundId;
    await loadRounds();
    if (keep && rounds.some(r => r.id === keep)) activeRoundId = keep;
  }

  async function loadAll(silent) {
    try {
      await Promise.all([loadSettings(), loadRounds()]);
      clearError();
      const now = new Date();
      lastSyncLabel = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    } catch (e) {
      if (!silent) showError("데이터를 불러오지 못했어요. 새로고침을 눌러 다시 시도해주세요.");
    }
    render();
    updateSyncStatusText();
  }
  function updateSyncStatusText() {
    syncStatus.textContent = `${secondsLeft}초 후 새로고침 · 마지막 동기화 ${lastSyncLabel || "-"}`;
  }
  async function saveSettings() {
    try { await db.ref("settings").set(settings); clearError(); }
    catch (e) { showError("저장에 실패했어요. 다시 시도해주세요."); }
  }
  async function saveRounds() {
    try { await db.ref("rounds").set(rounds); clearError(); }
    catch (e) { showError("저장에 실패했어요. 다시 시도해주세요."); }
  }

  async function unlockAdmin() {
    if (isAdmin) return true;
    if (settings.adminPin) {
      const pin = await openModal({ title: "관리자 확인", message: "관리자 비밀번호를 입력하세요.", inputType: "tel", placeholder: "비밀번호", confirmText: "확인" });
      if (pin === null) return false;
      if (pin === settings.adminPin) { isAdmin = true; return true; }
      showError("비밀번호가 올바르지 않습니다.", true);
      return false;
    } else {
      const pin = await openModal({ title: "관리자 비밀번호 설정", message: "아직 비밀번호가 없어요. 새로 설정하면 이후 금액·명단 수정에 이 비밀번호가 필요해요.", inputType: "tel", placeholder: "숫자 4자리 권장", confirmText: "설정" });
      if (pin === null || pin.trim() === "") return false;
      settings.adminPin = pin.trim();
      isAdmin = true;
      await saveSettings();
      return true;
    }
  }

  function activeRound() { return rounds.find(r => r.id === activeRoundId) || rounds[0]; }

  function renderReceipt(r) {
    const hasReceipt = !!r.receipt;
    let html = "";
    if (hasReceipt) {
      html += `<img src="${r.receipt}" class="receipt-thumb" id="receiptThumb" alt="영수증" />`;
    }
    html += `<div class="receipt-actions">
      <button class="pill-btn small" id="receiptAttachBtn">${isAdmin ? "" : "🔒 "}${hasReceipt ? "영수증 변경" : "영수증 첨부"}</button>
      ${hasReceipt ? `<button class="text-link" id="receiptDeleteBtn">삭제</button>` : ""}
    </div>`;
    receiptRow.innerHTML = html;

    document.getElementById("receiptAttachBtn").addEventListener("click", async () => {
      if (!isAdmin) {
        const ok = await unlockAdmin();
        render();
        if (!ok) return;
      }
      receiptFileInput.click();
    });
    if (hasReceipt) {
      document.getElementById("receiptThumb").addEventListener("click", () => openImageModal(r.receipt));
      document.getElementById("receiptDeleteBtn").addEventListener("click", deleteReceipt);
    }
  }

  function openImageModal(src) {
    imageModalImg.src = src;
    imageModalOverlay.style.display = "flex";
  }
  imageModalOverlay.addEventListener("click", () => {
    imageModalOverlay.style.display = "none";
    imageModalImg.src = "";
  });

  function compressImage(file, maxWidth, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("read failed"));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error("decode failed"));
        img.onload = () => {
          let width = img.width, height = img.height;
          if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleReceiptFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!file.type.startsWith("image/")) { showError("이미지 파일만 첨부할 수 있어요.", true); return; }
    try {
      const dataUrl = await compressImage(file, 900, 0.72);
      await refreshRoundsPreserveActive();
      activeRound().receipt = dataUrl;
      render();
      await saveRounds();
    } catch (err) {
      showError("영수증 이미지를 처리하지 못했어요.", true);
    }
  }

  async function deleteReceipt() {
    const ok = await openModal({ title: "영수증 삭제", message: "첨부된 영수증 사진을 삭제할까요?", confirmText: "삭제" });
    if (!ok) return;
    await refreshRoundsPreserveActive();
    delete activeRound().receipt;
    render();
    await saveRounds();
  }

  function roundDisplayLabel(label, idx) {
    return idx === 0 ? `${label}(전체)` : `${label}(개별)`;
  }

  function render() {
    tabsRow.innerHTML = rounds.map((r, i) => `
      <span class="tab-item${r.id === activeRoundId ? " active" : ""}">
        <button class="tab-label${rounds.length === 1 ? " solo" : ""}" data-id="${r.id}">${escapeHtml(roundDisplayLabel(r.label, i))}</button>
        ${rounds.length > 1 ? `<button class="tab-x" data-id="${r.id}" aria-label="차수 삭제">×</button>` : ""}
      </span>
    `).join("") + `<button class="tab-add" id="addRoundBtn" aria-label="차수 추가">+</button>`;

    const r = activeRound();
    const activeIdx = rounds.findIndex(x => x.id === activeRoundId);
    if (document.activeElement !== venueInput) venueInput.value = r.venue || "";

    billInput.readOnly = !isAdmin;
    billLock.textContent = isAdmin ? "💰" : "🔒";
    if (document.activeElement !== billInput) billInput.value = r.bill ? formatWon(r.bill) : "";
    billNote.style.display = activeIdx === 0 ? "block" : "none";

    renderReceipt(r);

    if (r.attendees.length === 0) {
      itemsList.innerHTML = "";
    } else {
      const sorted = [...r.attendees].sort((a, b) => a.name.localeCompare(b.name, "ko"));
      const rosterSet = new Set(settings.roster || []);
      itemsList.innerHTML = sorted.map((a) => {
        const isGuest = !rosterSet.has(a.name);
        return `
        <button type="button" class="chip${isGuest ? " guest" : ""}" data-name="${escapeHtml(a.name)}" title="탭하면 참석 시각 확인">${escapeHtml(a.name)}<span class="chip-x" title="참석 취소">×</span></button>`;
      }).join("");
    }

    const count = r.attendees.length;
    const perPerson = count > 0 ? r.bill / count : 0;
    countDisplay.textContent = `${count}명`;
    perPersonDisplay.textContent = `${formatWon(perPerson)}원`;
    formulaLine.textContent = count > 0 ? `${formatWon(r.bill)}원 ÷ ${count}명` : `참석 인원이 없으면 계산할 수 없어요`;
    summaryTitleText.textContent = `${r.label} 정산 요약`;

    heroCount.textContent = `${count}명`;
    heroRound.textContent = roundDisplayLabel(r.label, activeIdx);
    heroPerPerson.textContent = (r.bill > 0 && count > 0) ? `${formatWon(perPerson)}원` : "미정";

    rosterBtn.textContent = (isAdmin ? "" : "🔒 ") + "명단 등록·수정";

    document.querySelectorAll(".tab-label").forEach(btn => {
      btn.addEventListener("click", () => { activeRoundId = btn.dataset.id; render(); });
    });
    document.querySelectorAll(".tab-x").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); deleteRoundById(btn.dataset.id); });
    });
    document.getElementById("addRoundBtn").addEventListener("click", addRound);

    updateSuggestions();
  }

  async function addRound() {
    await refreshRoundsPreserveActive();
    const newRound = { id: genId(), label: nextLabel(), venue: "", attendees: [], bill: 0 };
    rounds.push(newRound);
    activeRoundId = newRound.id;
    render();
    await saveRounds();
  }

  async function deleteRoundById(id) {
    if (rounds.length <= 1) return;
    const target = rounds.find(x => x.id === id);
    if (!target) return;
    if (!isAdmin) {
      const unlocked = await unlockAdmin();
      render();
      if (!unlocked) return;
    }
    const ok = await openModal({ title: "차수 삭제", message: `'${target.label}' 참석자 명단과 금액을 모두 삭제할까요?`, confirmText: "삭제" });
    if (!ok) return;
    const keepActive = activeRoundId;
    await loadRounds();
    rounds = rounds.filter(x => x.id !== id);
    if (rounds.length === 0) ensureDefaultRound();
    else activeRoundId = rounds.some(x => x.id === keepActive) ? keepActive : rounds[0].id;
    render();
    await saveRounds();
  }

  function getDeviceId() {
    try {
      let id = localStorage.getItem("pmba-device-id");
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
        localStorage.setItem("pmba-device-id", id);
      }
      return id;
    } catch (e) {
      if (!window.__pmbaDeviceId) window.__pmbaDeviceId = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
      return window.__pmbaDeviceId;
    }
  }
  const deviceId = getDeviceId();

  async function addAttendeeByName(rawName) {
    const name = rawName.trim();
    if (!name) return;
    await refreshRoundsPreserveActive();
    const r = activeRound();
    if (r.attendees.some(a => a.name.toLowerCase() === name.toLowerCase())) { nameInput.value = ""; suggestList.style.display = "none"; return; }
    r.attendees.push({ name, joinedAt: Date.now(), addedBy: deviceId });
    nameInput.value = "";
    suggestList.style.display = "none";
    render();
    await saveRounds();
  }
  function addAttendee() { addAttendeeByName(nameInput.value); }

  async function removeAttendee(name) {
    const current = activeRound();
    const target = current.attendees.find(a => a.name === name);
    if (target && target.addedBy && !isAdmin && target.addedBy !== deviceId) {
      const ok = await unlockAdmin();
      render();
      if (!ok) return;
    }
    await refreshRoundsPreserveActive();
    const r = activeRound();
    r.attendees = r.attendees.filter(a => a.name !== name);
    render();
    await saveRounds();
  }

  async function handleVenueBlur() {
    await refreshRoundsPreserveActive();
    activeRound().venue = venueInput.value;
    render();
    await saveRounds();
  }

  function handleBillInput() {
    if (!isAdmin) return;
    const raw = billInput.value.replace(/[^0-9]/g, "");
    const num = raw ? parseInt(raw, 10) : 0;
    billInput.value = num ? formatWon(num) : "";
    const r = activeRound();
    r.bill = num;
    const count = r.attendees.length;
    const pp = count > 0 ? num / count : 0;
    perPersonDisplay.textContent = `${formatWon(pp)}원`;
    formulaLine.textContent = count > 0 ? `${formatWon(num)}원 ÷ ${count}명` : `참석 인원이 없으면 계산할 수 없어요`;
    heroPerPerson.textContent = (num > 0 && count > 0) ? `${formatWon(pp)}원` : "미정";
  }
  async function handleBillBlur() { if (isAdmin) await saveRounds(); }

  async function handleLockedFieldFocus(input) {
    if (isAdmin) return;
    input.blur();
    const ok = await unlockAdmin();
    render();
    if (ok) input.focus();
  }

  function updateSuggestions() {
    const q = nameInput.value.trim();
    const roster = settings.roster || [];
    if (!q || document.activeElement !== nameInput) { suggestList.style.display = "none"; suggestList.innerHTML = ""; return; }
    const already = new Set(activeRound().attendees.map(a => a.name));
    const matches = roster.filter(n => !already.has(n) && (n.includes(q) || chosungOf(n).includes(q)));
    if (matches.length === 0) { suggestList.style.display = "none"; suggestList.innerHTML = ""; return; }
    suggestList.style.display = "block";
    suggestList.innerHTML = matches.slice(0, 8).map(n => `<div class="suggest-item" data-name="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join("");
  }

  async function manageRoster() {
    const current = (settings.roster || []).join("\n");
    const text = await openModal({
      title: "참석자 명단 등록",
      message: "한 줄에 한 명씩 이름을 입력하세요. 참석 체크할 때 이름 앞글자나 초성만 입력해도 여기서 찾아 선택할 수 있어요.",
      inputType: "textarea",
      placeholder: "예)\n김철수\n이영희\n박민준",
      initialValue: current,
      confirmText: "저장"
    });
    if (text === null) return;
    const names = text.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
    settings.roster = Array.from(new Set(names));
    await saveSettings();
    render();
  }

  addBtn.addEventListener("click", addAttendee);
  nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addAttendee(); });
  nameInput.addEventListener("input", updateSuggestions);
  nameInput.addEventListener("focus", updateSuggestions);
  nameInput.addEventListener("blur", () => { setTimeout(() => { suggestList.style.display = "none"; }, 150); });
  suggestList.addEventListener("mousedown", (e) => {
    const item = e.target.closest(".suggest-item");
    if (!item) return;
    e.preventDefault();
    addAttendeeByName(item.dataset.name);
  });
  itemsList.addEventListener("click", (e) => {
    const x = e.target.closest(".chip-x");
    if (x) {
      const btn = x.closest(".chip");
      if (btn) removeAttendee(btn.dataset.name);
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) showJoinTime(chip.dataset.name);
  });
  function showJoinTime(name) {
    const r = activeRound();
    const a = r.attendees.find(x => x.name === name);
    if (!a || !a.joinedAt) return;
    const d = new Date(a.joinedAt);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    openModal({ title: `${name}님`, message: `${hh}:${mm}에 참석 체크했어요.`, confirmText: "확인", cancelText: "" });
  }
  venueInput.addEventListener("blur", handleVenueBlur);
  billInput.addEventListener("focus", () => handleLockedFieldFocus(billInput));
  billInput.addEventListener("input", handleBillInput);
  billInput.addEventListener("blur", handleBillBlur);
  receiptFileInput.addEventListener("change", handleReceiptFile);
  refreshBtn.addEventListener("click", () => { secondsLeft = 10; loadAll(false); });
  rosterBtn.addEventListener("click", async () => {
    const ok = await unlockAdmin();
    render();
    if (ok) manageRoster();
  });

  setDateLine();
  loadAll(true);
  setInterval(async () => {
    secondsLeft -= 1;
    if (secondsLeft <= 0) {
      secondsLeft = 10;
      await loadAll(true);
    } else {
      updateSyncStatusText();
    }
  }, 1000);
})();
</script>
</body>
</html>
